[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "money_tracker"
version = "0.1.0"
description = "Expense tracking with pipeline, sequences, and dashboard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "dash>=2.14",
    "plotly>=5.18",
    "pdfplumber>=0.11",
    "openpyxl>=3.1.0",
    "kaleido>=0.2.1,<1",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "selenium>=4.0",
    "psutil>=5.0",
    "multiprocess>=0.70",
    "beautifulsoup4>=4.12",
    "percy>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["money_tracker*"]
